name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # CLIの既定の接続先（buildの入力）。CIのbuildは配布しないため、localのapps/webを与える。
      HARNESSFORCE_BUILD_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # REQUIRED_CLI_VERSIONを上げ忘れると、古いCLIの端末でsetupやhookが途中で失敗する。
      - run: node scripts/check-required-cli.mjs
      # Claude Codeは解析できないfrontmatterや未知のfieldを黙って読み飛ばすため、配る形をstrictに検証する。認証は要らない。
      - run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate --strict .
      - run: npx --yes @anthropic-ai/claude-code@2.1.322 plugin validate --strict plugins/harnessforce/dist/npm

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node || 'from .node-version' }})
    strategy:
      # 1つのOSの失敗で他のOSの結果を捨てない。
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-24.04
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HARNESSFORCE_BUILD_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # node-versionが空ならnode-version-fileを使う。
          node-version: ${{ matrix.node }}
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@harnessforce/agent-core --filter=@harnessforce/cli --filter=@harnessforce/claude-code-plugin

  # correlation.md「実行環境」: hookは端末のNode.js 18以上で動き、harnessforceも同じNode.jsで起動される。
  # 開発とbuildは.node-versionのNode.jsで行い、build済みの成果物だけを18で実行する。
  node18-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      HARNESSFORCE_BUILD_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@harnessforce/cli --filter=@harnessforce/claude-code-plugin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - run: node --version | grep '^v18\.'
      - run: test "$(node packages/cli/dist/bin.js --version)" = "$(node -p 'require("./packages/cli/package.json").version')"
      # hookは入力が無くても壊れていても、exit 0で終える。
      - run: node plugins/harnessforce/dist/marketplace/plugins/harnessforce/scripts/harnessforce-hook.cjs session-start < /dev/null
      - run: echo 'not json' | node plugins/harnessforce/dist/marketplace/plugins/harnessforce/scripts/harnessforce-hook.cjs user-prompt-submit
