name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # productionのドメインがHarnessforceのenvironments.md「接続先」に記録され、npm scopeが作られるまで無効にしておく。
    # それまでは一般への配布（npmへのpublish）が対象外である。有効にする手順はdocs/runbooks/releasing.mdを参照。
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    # npmのtrusted publishingとprovenanceはGitHub-hosted runnerでしか使えない。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # CLIの既定の接続先（buildの入力）。未設定ならbuildが失敗し、既定値で補わない。設定する値はdocs/runbooks/releasing.mdを参照。
      HARNESSFORCE_BUILD_URL: ${{ vars.HARNESSFORCE_BUILD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          # registry-urlは付けない。setup-nodeが環境変数のtokenを読む.npmrcを書き、trusted publishingのOIDCと競合する。
      - run: pnpm install --frozen-lockfile
      # changeset publishはpnpm publishを通じてnpm publishを実行する。trusted publishingはnpm 11.5.1以上を要する。
      - run: npm install -g npm@11.20.0
      # 最初の公開を0.1.0にする。0.1.0がnpmに無いpackageへのchangesetがあると、version PRが0.1.0を飛ばすため止める。手順はdocs/runbooks/releasing.mdを参照。
      - run: node scripts/check-first-release.mjs
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npmへの認証はtrusted publishing（id-token: writeで得るOIDC token）だけで行い、長期のtokenを渡さない。
          NPM_CONFIG_PROVENANCE: "true"
      - name: Verify registry versions
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/verify-published.mjs
