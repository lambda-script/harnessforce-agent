name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # productionのドメインがHarnessforceのenvironments.md「接続先」に記録され、npm scopeが作られるまで無効にしておく。
    # それまでは一般への配布（npmへのpublish）が対象外である。有効にする手順はdocs/runbooks/releasing.mdを参照。
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    # npmのtrusted publishingとprovenanceはGitHub-hosted runnerでしか使えない。
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          # registry-urlは付けない。setup-nodeが環境変数のtokenを読む.npmrcを書き、trusted publishingのOIDCと競合する。
      - run: pnpm install --frozen-lockfile
      # changeset publishはpnpm publishを通じてnpm publishを実行する。trusted publishingはnpm 11.5.1以上を要する。
      - run: npm install -g npm@11.20.0
      # 最初の公開を0.1.0にする。0.1.0がnpmに無いpackageへのchangesetがあると、version PRが0.1.0を飛ばすため止める。手順はdocs/runbooks/releasing.mdを参照。
      - run: node scripts/check-first-release.mjs
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npmへの認証はtrusted publishing（id-token: writeで得るOIDC token）だけで行い、長期のtokenを渡さない。
          NPM_CONFIG_PROVENANCE: "true"
      - name: Verify registry versions
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
        run: node scripts/verify-published.mjs
